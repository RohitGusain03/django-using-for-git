{% extends "base.html" %}

{% block title %}Delete post{% endblock %}

{% block content %}

<div class="confirm-card sticker">
    <span class="emoji">🗑️</span>
    <h2>Delete "{{ post.title }}"?</h2>
    <p class="text-soft">This can't be undone — the post, its images and comments will be gone for good.</p>

    <form method="post">
        {% csrf_token %}
        <div class="confirm-actions">
            <a href="{% url 'post_detail' post.id %}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-coral">Yes, delete it</button>
        </div>
    </form>
</div>

{% endblock %}
