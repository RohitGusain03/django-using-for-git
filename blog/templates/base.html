<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>{% block title %}My Django Blog{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            My Django Blog
        </a>

        <div class="ms-auto d-flex align-items-center">

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    Welcome, {{ user.username }}
                </span>

                <a href="{% url 'profile' %}" class="btn btn-info me-2">
                    Profile
                </a>

                <a href="{% url 'create_post' %}" class="btn btn-success me-2">
                    Create Post
                </a>

                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-danger">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}" class="btn btn-primary me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-success">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-5">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
