{% extends "base.html" %}

{% block title %}Edit comment{% endblock %}

{% block content %}

<div class="composer">
    <div class="page-head" style="padding-top:10px;">
        <span class="eyebrow">✏️ editing</span>
        <h1>Edit your comment</h1>
    </div>

    <form method="post" class="composer-card sticker">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="{{ form.content.id_for_label }}">Comment</label>
            {{ form.content }}
            {% if form.content.errors %}<div class="form-errors">{{ form.content.errors|striptags }}</div>{% endif %}
        </div>

        <div class="flex justify-between items-center" style="margin-top:16px;">
            <a href="{% url 'post_detail' comment.post.id %}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</div>

{% endblock %}
